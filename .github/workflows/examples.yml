name: Build and browser checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [nextjs, react, vanilla, astro]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ${{ matrix.example }}/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: ${{ matrix.example }}
      - run: npx playwright install --with-deps chromium
      - run: npm run check -- ${{ matrix.example }}
